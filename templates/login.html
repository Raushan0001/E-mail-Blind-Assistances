<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Add Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Body and background styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #2c3e50; /* Background color */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* Container styles for the login form */
        .container {
            background-color: rgba(0, 0, 0, 0.8); /* Dark transparent background */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            width: 300px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #f1f1f1;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .show-password {
            display: flex;
            align-items: center;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .show-password input {
            margin-right: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .mic-btn {
            background-color: #ff4500;
            color: #fff;
            border: none;
            border-radius: 50%;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 5px;
            position: relative;
        }

        /* Tooltip styles */
        .mic-btn[title] {
            position: relative;
        }

        .mic-btn[title]::after {
            content: attr(title);
            position: absolute;
            left: 50%;
            bottom: 120%;
            transform: translateX(-50%);
            background-color: #333;
            color: #fff;
            padding: 5px;
            border-radius: 3px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .mic-btn:hover::after {
            opacity: 1;
        }

        /* Responsive layout */
        @media (max-width: 768px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form method="POST">
            <label for="email">Email:</label>
            <div style="display: flex; align-items: center;">
                <input type="email" id="email" name="email" required>
                <button type="button" class="mic-btn" title="Use microphone for voice input" onclick="startRecognition('email')">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>

            <label for="password">Password:</label>
            <div style="display: flex; align-items: center;">
                <input type="password" id="password" name="password" required>
                <button type="button" class="mic-btn" title="Use microphone for voice input" onclick="startRecognition('password')">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>

            <!-- Show Password checkbox -->
            <div class="show-password">
                <input type="checkbox" id="show-password" onclick="togglePassword()">
                <label for="show-password">Show Password</label>
            </div>

            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        // Speech recognition for filling in fields
        function startRecognition(fieldId) {
            if (!('webkitSpeechRecognition' in window)) {
                alert("Sorry, your browser doesn't support speech recognition.");
                return;
            }
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById(fieldId).value = transcript;
            };

            recognition.onerror = function(event) {
                console.log('Speech recognition error:', event.error);
                alert('Error during speech recognition. Please try again.');
            };

            recognition.start();
        }

        // Toggle show/hide password
        function togglePassword() {
            const passwordField = document.getElementById("password");
            passwordField.type = passwordField.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
